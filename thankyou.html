<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(to right, #ffecd2, #fcb69f);
            color: #333;
            text-align: center;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: clamp(24px, 6vw, 50px);
        }
        h1 {
            font-size: clamp(2rem, 6vw, 3rem);
            margin-bottom: 20px;
            color: #b34438;
        }
        p { font-size: 1.3rem; margin-bottom: 30px; }
        .button {
            display: inline-block;
            padding: 15px 30px;
            font-size: 1.2rem;
            color: white;
            background: #b34438;
            border-radius: 25px;
            text-decoration: none;
            transition: background 0.3s ease;
        }
        .button:hover { background: #8f352b; }
        .button:focus-visible {
            outline: 3px solid #333;
            outline-offset: 4px;
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>Thank You</h1>
        <p>Thank you for forgiving me. You mean so much to me, and I’m grateful we can move forward together.</p>
        <a class="button" href="test2.html">Back to the apology</a>
    </main>
</body>
</html>
