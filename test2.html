<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I'm Sorry</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(to right, #ffecd2, #fcb69f);
            color: #333;
            text-align: center;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: clamp(24px, 6vw, 50px);
        }
        h1 {
            font-size: clamp(2rem, 6vw, 3rem);
            margin-bottom: 20px;
            color: #b34438;
        }
        p {
            font-size: 1.3rem;
            margin-bottom: 30px;
        }
        .button {
            display: inline-block;
            padding: 15px 30px;
            font-size: 1.2rem;
            color: white;
            background: #b34438;
            border: none;
            border-radius: 25px;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        .button:hover { background: #8f352b; }
        .button:focus-visible {
            outline: 3px solid #333;
            outline-offset: 4px;
        }
        #confirmation { margin-top: 20px; }
    </style>
</head>
<body>
    <main class="container">
        <h1>I'm Sorry</h1>
        <p>I didn’t mean to hurt you, and I feel terrible for unintentionally ignoring you. You mean so much to me, and I want to make things right.</p>
        <p>Will you forgive me?</p>
        <button id="forgive-button" class="button" type="button" aria-controls="confirmation" aria-expanded="false">Forgive Me</button>
        <div id="confirmation" hidden>
            <p>Are you sure?</p>
            <a id="confirm-link" class="button" href="thankyou.html">Yes, I Forgive You</a>
        </div>
    </main>
    <script>
        const forgiveButton = document.getElementById('forgive-button');
        const confirmation = document.getElementById('confirmation');

        forgiveButton.addEventListener('click', () => {
            confirmation.hidden = false;
            forgiveButton.setAttribute('aria-expanded', 'true');
            forgiveButton.disabled = true;
            document.getElementById('confirm-link').focus();
        });
    </script>
</body>
</html>
