name: Check Pages domain settings

on:
  push:
    branches: [arena/e24c4006-apology]
    paths: [.github/workflows/check-pages-domain.yml]

permissions:
  pages: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Remove the inactive legacy domain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'JS'
          async function main() {
            const root = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/pages`;
            const headers = {
              Authorization: `Bearer ${process.env.GH_TOKEN}`,
              Accept: 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28'
            };
            const current = await fetch(root, { headers });
            const settings = await current.json();
            if (!current.ok) throw new Error(`Reading Pages settings: HTTP ${current.status}: ${JSON.stringify(settings)}`);
            if (settings.cname !== 'www.asmallattempttomakeituptoyou.com') {
              console.log('The inactive domain is already removed.');
              return;
            }
            const response = await fetch(root, {
              method: 'PUT',
              headers: { ...headers, 'Content-Type': 'application/json' },
              body: JSON.stringify({ cname: null, build_type: 'workflow' })
            });
            const text = await response.text();
            if (!response.ok) throw new Error(`Updating Pages settings: HTTP ${response.status}: ${text}`);
            console.log('Removed the inactive domain; the free GitHub Pages address is now active.');
          }
          main().catch(error => {
            const message = error.message.replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A');
            console.error(`::error::${message}`);
            process.exitCode = 1;
          });
          JS
